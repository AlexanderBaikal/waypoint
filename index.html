<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waypoint — points of interest on open map data</title>
    <meta
      name="description"
      content="A map client for exploring points of interest, built on Leaflet and OpenStreetMap."
    />
    <meta name="theme-color" content="#14171b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Settles the theme before the first paint. Dark is the default, so
      // without this every load would show the light interface for as long as
      // it takes React to mount and put the attribute on. The key is
      // THEME_KEY in src/app/uiSlice.ts, which makes the same choice again
      // once the store is built.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("waypoint:theme") === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
