       dark one. Kept in sync with src/components/Mark.tsx. -->
  <rect width="32" height="32" rx="7.5" fill="#1a73e8" />
  <path
    d="M16 28.5c-.1 0-9-10.6-9-16.8a9 9 0 1 1 18 0c0 6.2-8.9 16.8-9 16.8Z"
    fill="#fff"
  />
  <circle cx="16" cy="11.6" r="3.4" fill="#1a73e8" />
</svg>
